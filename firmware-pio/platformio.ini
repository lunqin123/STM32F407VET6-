; ============================================================
; STM32F407VET6 — PlatformIO 项目配置
;
; 目的：把「手写寄存器地址」换成「调用现成库」
;       库依赖、编译选项、烧录方式都在这里声明，不用再手改 Makefile
;
; 框架：Arduino (stm32duino) —— SimpleFOC / ROSserial 等机器人库原生支持它
;
; 【两个环境，用 -e 切换】
;   pio run -e genericSTM32F407VET6 -t upload   → 电机控制固件（src/main.cpp）
;   pio run -e selftest            -t upload   → 硬件自检固件（src/selftest.cpp）
;   pio run -e selftest -t monitor             → 打开串口菜单
; ============================================================

; ---------- 两个环境共用的配置 ----------
[env]
platform  = ststm32
board     = genericSTM32F407VET6
framework = arduino

; ---------- 烧录 & 调试（ST-Link V2，¥10 克隆版即可）----------
upload_protocol = stlink
debug_tool      = stlink

; ---------- 编译选项 ----------
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D HAL_UART_MODULE_ENABLED
    ; ★ 必须链接浮点 printf：newlib-nano 默认裁掉 %f，
    ;   症状 = snprintf/printf 输出浮点为空（OLED 只显示单位没有数字）
    ;   注意必须用 -Wl, 写法：直接写 "-u _printf_float" 会被 PIO 拆开，
    ;   孤立的 -u 会吞掉后面的 -mcpu=cortex-m4 导致 CMSIS 编译报错
    ;   代价：flash +~10KB
    -Wl,-u,_printf_float
    ; 注意：不要再加 -D HAL_TIM_MODULE_ENABLED —— Arduino 框架已定义，重复会告警

; ---------- 依赖库：本地内置（vendor），不依赖 PlatformIO 联网下载 ----------
; 两个库已解包到项目根目录的 lib/ 下（PlatformIO 会自动扫描 lib/）：
;   lib/Simple FOC/   ← askuric/Simple FOC @ 2.3.4
;   lib/U8g2/         ← olikraus/U8g2 @ 2.36.18
; 这样做的好处：离线可编译、版本锁死、跨机器一致。
;
; 版本约束（务必遵守，踩过坑）：
;   ★ Simple FOC 必须 ≤ 2.3.x，不要用 2.4.0 或 GitHub 主分支：
;     2.4.0+ 调用 enableTimerClock(TIM_HandleTypeDef*)，而 PlatformIO 自带的
;     framework-arduinoststm32 4.30000.0 签名是 enableTimerClock(TIM_TypeDef*)，
;     不兼容会编译失败。2.3.4 与 4.30000.0 匹配。
;   ★ U8g2 锁定 2.36.18：实测编译通过，避免"某天突然编不过"。
;
; 【想换回联网 lib_deps 的机器】把下面两行取消注释即可（需联网 + 无安全删除拦截的环境）：
;   lib_deps = askuric/Simple FOC @ 2.3.4, olikraus/U8g2 @ 2.36.18
; 当前用本地内置，所以保持 lib_deps 为空（库在 lib/ 里，PIO 自动发现）。

; ---------- 串口监视器 ----------
monitor_speed = 115200

; ============================================================
; 环境 1：电机控制（默认环境）
; ============================================================
[env:genericSTM32F407VET6]
build_src_filter = +<main.cpp>

; ============================================================
; 环境 2：硬件到货自检
;   不依赖电机，先逐个验证 I2C / OLED / LED / PWM，避免多个新变量同时失效
; ============================================================
[env:selftest]
build_src_filter = +<selftest.cpp>

; ============================================================
; 环境 3：闭环 FOC（AS5600 编码器，速度/位置环）
;   电机套装自带 AS5600 → 到货当天开环(main) / 自检(selftest) / 闭环(本环境) 三件套齐备
; ============================================================
[env:closedloop]
build_src_filter = +<closedloop.cpp>

; ============================================================
; 环境 4：云台视觉追踪（单轴水平）
;   PC(OpenCV) 检测目标 → 串口发 T<角度> → 本固件角度环转到目标角
;   配套脚本：vision/vision_tracker.py
; ============================================================
[env:gimbal]
build_src_filter = +<gimbal_tracker.cpp>

; ============================================================
; 环境 5：AS5600 底层诊断（绕过 SimpleFOC 直读寄存器）
;   症状：I2C 扫描在线但角度恒 0 / 不变 → 用它定性磁铁/总线层
; ============================================================
[env:as5600test]
build_src_filter = +<as5600test.cpp>

; ============================================================
; 环境 6：无动力智能旋钮（AS5600 输入设备，不需要 12V）
;   转电机轴 = 旋钮，OLED 显示 0~100 + 进度条，串口回显
;   12V 到位后可升级 FOC 力反馈（棘轮/阻尼，Smart Knob）
; ============================================================
[env:knob]
build_src_filter = +<knob.cpp>
